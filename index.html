<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expert.com</title>
<style>
  :root {
    --bg: #0e1410;
    --card: #161d18;
    --border: #2a332c;
    --text: #eef2ee;
    --muted: #8b978d;
    --accent: #3fae6b;
    --accent-dark: #1f6b3f;
    --danger: #d9534f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 3rem;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem 1rem 1rem;
    user-select: none;
    -webkit-user-select: none;
  }
  header h1 {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.3px;
    margin: 0;
    cursor: pointer;
  }
  header h1 span { color: var(--accent); }
  main {
    max-width: 480px;
    margin: 0 auto;
    padding: 0 1rem;
  }
  .empty {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 3rem 1rem;
  }
  .match-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem 1.1rem;
    margin-bottom: 12px;
  }
  .match-title {
    font-size: 15px;
    font-weight: 600;
  }
  .match-comp {
    font-size: 12px;
    color: var(--muted);
    margin: 2px 0 10px;
  }
  .market {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 6px;
    font-size: 13px;
    padding: 8px 0;
    border-top: 1px solid var(--border);
  }
  .market .label {
    font-size: 10px;
    color: var(--muted);
    display: block;
    margin-bottom: 2px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .market .total.crossed {
    background: rgba(63, 174, 107, 0.15);
    border-radius: 6px;
    padding: 2px 6px;
    color: var(--accent);
    font-weight: 600;
  }
  .market-name {
    font-size: 12px;
    color: var(--muted);
    margin-top: 8px;
  }
  /* admin */
  #admin-view {
    display: none;
  }
  .field-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 8px;
  }
  input {
    width: 100%;
    background: #0e1410;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
  }
  input::placeholder { color: var(--muted); }
  .admin-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.1rem 1.2rem;
    margin-bottom: 1rem;
  }
  .admin-card h2 {
    font-size: 13px;
    color: var(--muted);
    font-weight: 500;
    margin: 0 0 12px;
  }
  .market-block {
    border-top: 1px solid var(--border);
    padding-top: 10px;
    margin-top: 10px;
  }
  .market-block p {
    font-size: 14px;
    font-weight: 600;
    margin: 0 0 8px;
  }
  button {
    width: 100%;
    background: var(--accent);
    color: #06170d;
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-size: 14px;
    font-weight: 600;
    margin-top: 10px;
    cursor: pointer;
  }
  button:active { transform: scale(0.98); }
  .error {
    color: var(--danger);
    font-size: 13px;
    margin: 8px 0 0;
    display: none;
  }
  .status {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    padding: 1rem;
  }
</style>
</head>
<body>

<header>
  <h1 id="title-tap">Expert<span>.com</span></h1>
</header>

<main>
  <div id="status" class="status">Chargement…</div>
  <div id="public-view"></div>

  <div id="admin-view">
    <div class="admin-card">
      <h2>Ajouter un match</h2>
      <div class="field-group">
        <input id="team1" placeholder="Équipe 1" />
        <input id="team2" placeholder="Équipe 2" />
      </div>
      <input id="competition" placeholder="Compétition (ex: La Liga)" style="margin-bottom:12px;" />
      <div id="markets-form"></div>
      <p id="form-error" class="error"></p>
      <button id="publish-btn">Publier</button>
    </div>
  </div>
</main>

<!-- Firebase SDK (compat, no bundler needed) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyA46UewY2NGkxZga56HH2qD5LMR6pauaTU",
  authDomain: "expert-com.firebaseapp.com",
  projectId: "expert-com",
  storageBucket: "expert-com.firebasestorage.app",
  messagingSenderId: "544154746516",
  appId: "1:544154746516:web:20d998446b5f3e86753e81",
  measurementId: "G-X7TKHXD3X1"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const markets = [
  { key: 'tirs', label: 'Tirs' },
  { key: 'tacles', label: 'Tacles' },
  { key: 'cadres', label: 'Tirs cadrés' }
];

function buildMarketsForm() {
  const c = document.getElementById('markets-form');
  c.innerHTML = markets.map(m => `
    <div class="market-block">
      <p>${m.label}</p>
      <div class="field-group">
        <input id="${m.key}-t1" placeholder="Équipe 1 (ex: 4.5/5.5)" />
        <input id="${m.key}-t2" placeholder="Équipe 2 (ex: 6.5/7.5)" />
      </div>
      <div class="field-group">
        <input id="${m.key}-tot" placeholder="Total (ex: 14.5/15.5)" />
        <input id="${m.key}-seuil" type="number" step="0.5" placeholder="Seuil (ex: 14.5)" />
      </div>
    </div>
  `).join('');
}
buildMarketsForm();

function parseLow(rangeStr) {
  if (!rangeStr) return null;
  const n = parseFloat(rangeStr.split('/')[0]);
  return isNaN(n) ? null : n;
}

function renderPublic(docs) {
  const el = document.getElementById('public-view');
  const statusEl = document.getElementById('status');
  statusEl.style.display = 'none';

  if (docs.length === 0) {
    el.innerHTML = '<div class="empty">Aucun pronostic publié pour l\'instant.</div>';
    return;
  }

  el.innerHTML = docs.map(match => `
    <div class="match-card">
      <div class="match-title">${match.team1} — ${match.team2}</div>
      <div class="match-comp">${match.competition || 'Compétition non précisée'}</div>
      ${markets.map(m => {
        const d = match[m.key] || {};
        const low = parseLow(d.tot);
        const crossed = (low !== null && d.seuil !== null && d.seuil !== undefined && low >= d.seuil);
        return `
        <div class="market-name">${m.label}</div>
        <div class="market">
          <div><span class="label">Éq. 1</span>${d.t1 || '—'}</div>
          <div><span class="label">Éq. 2</span>${d.t2 || '—'}</div>
          <div class="${crossed ? 'total crossed' : ''}"><span class="label">Total</span>${d.tot || '—'}</div>
        </div>`;
      }).join('')}
    </div>
  `).join('');
}

// Real-time listener: matches update live for every visitor
db.collection('matches').orderBy('createdAt', 'desc').onSnapshot(
  (snapshot) => {
    const docs = snapshot.docs.map(d => d.data());
    renderPublic(docs);
  },
  (err) => {
    document.getElementById('status').textContent = 'Erreur de connexion à la base de données.';
    console.error(err);
  }
);

// Hidden admin mode: tap the title 5 times within 3 seconds
let tapCount = 0;
let tapTimer = null;
document.getElementById('title-tap').addEventListener('click', () => {
  tapCount++;
  if (tapTimer) clearTimeout(tapTimer);
  tapTimer = setTimeout(() => { tapCount = 0; }, 3000);

  if (tapCount >= 5) {
    tapCount = 0;
    const pub = document.getElementById('public-view');
    const adm = document.getElementById('admin-view');
    const showingAdmin = adm.style.display === 'block';
    adm.style.display = showingAdmin ? 'none' : 'block';
    pub.style.display = showingAdmin ? 'block' : 'none';
    document.getElementById('status').style.display = 'none';
  }
});

document.getElementById('publish-btn').addEventListener('click', () => {
  const errEl = document.getElementById('form-error');
  const team1 = document.getElementById('team1').value.trim();
  const team2 = document.getElementById('team2').value.trim();
  const competition = document.getElementById('competition').value.trim();

  if (!team1 || !team2) {
    errEl.textContent = "Renseigne les deux noms d'équipe.";
    errEl.style.display = 'block';
    return;
  }
  errEl.style.display = 'none';

  const marketData = {};
  for (const m of markets) {
    const seuilVal = parseFloat(document.getElementById(`${m.key}-seuil`).value);
    marketData[m.key] = {
      t1: document.getElementById(`${m.key}-t1`).value.trim(),
      t2: document.getElementById(`${m.key}-t2`).value.trim(),
      tot: document.getElementById(`${m.key}-tot`).value.trim(),
      seuil: isNaN(seuilVal) ? null : seuilVal
    };
  }

  db.collection('matches').add({
    team1, team2, competition,
    ...marketData,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(() => {
    document.getElementById('team1').value = '';
    document.getElementById('team2').value = '';
    document.getElementById('competition').value = '';
    buildMarketsForm();
    document.getElementById('admin-view').style.display = 'none';
    document.getElementById('public-view').style.display = 'block';
  }).catch((err) => {
    errEl.textContent = "Erreur lors de la publication. Réessaie.";
    errEl.style.display = 'block';
    console.error(err);
  });
});
</script>
</body>
</html>
